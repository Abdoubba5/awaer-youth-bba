<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل | منصة وعي الشباب BBA</title>
  <meta name="theme-color" content="#06090e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#06090e;--surface:rgba(11,16,27,0.75);--gold:#D4AF37;--gold-hover:#B3922E;--gold-light:rgba(212,175,55,0.12);--text:#ffffff;--muted:#94a3b8;--border:rgba(212,175,55,0.15);--radius-lg:20px;--font:'Cairo',sans-serif}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--font);background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;line-height:1.8}
    .card{background:var(--surface);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius-lg);padding:3rem 2rem;max-width:480px;width:100%}
    .icon{font-size:4rem;margin-bottom:1rem}
    h1{font-size:1.5rem;margin-bottom:0.75rem;color:var(--gold)}
    p{color:var(--muted);margin-bottom:1.5rem;font-size:0.95rem}
    .btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.75rem 1.75rem;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold-hover));color:var(--bg);font-family:var(--font);font-size:0.9rem;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:all 0.3s ease}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(212,175,55,0.3)}
    .retry-btn{background:transparent;color:var(--gold);border:1px solid var(--gold);margin-top:0.75rem}
    .retry-btn:hover{background:var(--gold-light);color:var(--gold)}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أنك غير متصل حالياً. يمكنك العودة للمحاولة عندما يتوفر الاتصال.</p>
    <button class="btn" onclick="window.location.reload()">🔄 إعادة المحاولة</button>
    <br>
    <button class="btn retry-btn" onclick="window.location.href='index.html'">🏠 العودة للصفحة الرئيسية</button>
  </div>
</body>
</html>
