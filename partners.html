<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://ouyqcyrbppkxvcknxtbn.supabase.co wss://ouyqcyrbppkxvcknxtbn.supabase.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="شركاء منصة وعي الشباب BBA - Dz Young Leaders">
  <meta name="theme-color" content="#06090e">
  <title>الشركاء | منصة وعي الشباب BBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/identity.css">
  <link rel="stylesheet" href="css/homepage.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23C9A84C'/%3E%3Ctext y='68' x='50' text-anchor='middle' font-size='50' fill='%2306090e' font-weight='700' font-family='Cairo'%3Eوعي%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root{--bg:#050712;--surface:rgba(12,17,34,0.88);--surface-solid:#0C1122;--surface-card:rgba(16,22,42,0.92);--gold:#C9A84C;--gold-hover:#B8943E;--gold-light:rgba(201,168,76,0.10);--gold-glow:rgba(201,168,76,0.20);--teal:#2DD4BF;--teal-bg:rgba(45,212,191,0.08);--success:#34D399;--success-bg:rgba(52,211,153,0.10);--danger:#F87171;--danger-bg:rgba(248,113,113,0.10);--text:#F5F0E8;--text-secondary:#D1CEC6;--text-dim:#9E9A94;--text-muted:#7A7670;--border:rgba(201,168,76,0.12);--border-light:rgba(255,255,255,0.04);--border-gold:rgba(201,168,76,0.25);--radius-xs:4px;--radius-sm:6px;--radius-md:12px;--radius-lg:20px;--radius-xl:32px;--shadow-sm:0 2px 8px rgba(0,0,0,0.3);--shadow-md:0 8px 32px rgba(0,0,0,0.4);--shadow-lg:0 16px 48px rgba(0,0,0,0.5);--shadow-gold:0 8px 32px rgba(201,168,76,0.10);--shadow-gold-hover:0 12px 40px rgba(201,168,76,0.20);--font:'Cairo',sans-serif;--transition:all 0.4s cubic-bezier(0.4,0,0.2,1);--nav-height:72px;--nav-height-mobile:64px}
    *,:before,:after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:80px}
    body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.8;direction:rtl;min-height:100vh;-webkit-font-smoothing:antialiased}
    h2{font-size:clamp(1.5rem,3.5vw,2.25rem)}h3{font-size:clamp(1.25rem,2.5vw,1.5rem)}h2,h3,h4{font-weight:700;line-height:1.4}
    p{color:var(--text-dim);font-size:clamp(0.9rem,1.2vw,1rem)}a{color:var(--gold);text-decoration:none;transition:all 0.3s ease}a:hover{color:var(--gold-hover)}ul{list-style:none}img{max-width:100%;height:auto;display:block}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
    .partner-logo{width:120px;height:120px;object-fit:contain;margin-bottom:1rem;border-radius:var(--radius-md);background:var(--surface);padding:0.75rem;border:1px solid var(--border)}
    .partner-logo-placeholder{width:120px;height:120px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto 1rem;border-radius:var(--radius-md);background:var(--gold-light);border:1px solid var(--border-gold)}
  </style>
</head>
<body>
<div id="navbar"></div>


  <section class="section" style="padding-top:calc(var(--nav-height) + 2rem)">
    <div class="container">
      <div class="section-header">
        <div class="hero-badge" style="margin-bottom:1rem">🤝 شركاؤنا</div>
        <h2>شركاء النجاح</h2>
        <p>نفخر بشراكتنا مع هذه المؤسسات والهيئات التي تدعم رسالتنا في التوعية وتمكين الشباب</p>
        <span class="gold-accent"></span>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div id="partnersSection" class="impact-grid" style="gap:2rem">
        <div style="text-align:center;padding:3rem;color:var(--muted);grid-column:1/-1">
          <div style="font-size:3rem;margin-bottom:1rem">🤝</div>
          <p>جاري تحميل الشركاء...</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section" style="background:var(--bg-warm)">
    <div class="container">
      <div class="section-header">
        <h3 style="color:var(--gold)">كن شريكاً لنا</h3>
        <p>ندعو المؤسسات والهيئات المهتمة بدعم الشباب والتوعية للانضمام إلينا كشركاء</p>
        <span class="gold-accent"></span>
      </div>
      <div class="form-card" style="max-width:500px">
        <form id="partnerContactForm">
          <div class="form-group">
            <label>اسم المؤسسة *</label>
            <input type="text" id="pcName" placeholder="اسم المؤسسة" required>
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني *</label>
            <input type="email" id="pcEmail" placeholder="contact@example.com" required dir="ltr">
          </div>
          <div class="form-group">
            <label>الرسالة</label>
            <textarea id="pcMessage" placeholder="اكتب رسالتك..." style="min-height:80px"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">📩 إرسال</button>
        </form>
        <div id="pcSuccess" style="display:none;text-align:center;padding:1rem;color:var(--success);font-weight:600">✅ تم إرسال طلبكم. سنتواصل معكم قريباً.</div>
      </div>
    </div>
  </section>

<div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/database.js"></script>
  <script src="js/platform-core.js"></script>
  <script src="js/cms.js"></script>
  <script>
    (function() {
      var ts = document.getElementById('partnersThemeSwitcher');
      if (ts && window.BBA && window.BBA.Theme) window.BBA.Theme.createSwitcher(ts);

      function escapeHtml(t) { if (!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

      function renderPartners() {
        var container = document.getElementById('partnersSection');
        if (!container) return;
        var data = [];
        if (window.CMS) data = window.CMS.getPartners();
        data = data.filter(function(p) { return p.published !== false; });
        if (data.length === 0) {
          container.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--muted);grid-column:1/-1"><div style="font-size:3rem;margin-bottom:1rem">🤝</div><p>سيتم إضافة الشركاء قريباً</p></div>';
          return;
        }
        var categories = {};
        for (var i = 0; i < data.length; i++) {
          var cat = data[i].category || 'شركاء';
          if (!categories[cat]) categories[cat] = [];
          categories[cat].push(data[i]);
        }
        var html = '';
        for (var cat in categories) {
          html += '<div style="grid-column:1/-1;text-align:center;margin:1rem 0 0.5rem"><h4 style="color:var(--gold);font-size:0.95rem">🏷️ ' + escapeHtml(cat) + '</h4><div class="gold-accent"></div></div>';
          for (var j = 0; j < categories[cat].length; j++) {
            var p = categories[cat][j];
            html += '<div class="mosaic-tile" style="padding:1.5rem;text-align:center">' +
              '<span class="mosaic-corner mosaic-corner-tl"></span><span class="mosaic-corner mosaic-corner-tr"></span>' +
              (p.logo ? '<img src="' + p.logo + '" alt="' + escapeHtml(p.name) + '" class="partner-logo" style="margin:0 auto 1rem" onerror="this.style.display=\'none\'">' : '<div class="partner-logo-placeholder" style="margin:0 auto 1rem">🤝</div>') +
              '<h4 style="color:var(--text);margin-bottom:0.5rem;font-size:0.95rem">' + escapeHtml(p.name) + '</h4>' +
              (p.website ? '<a href="' + p.website + '" target="_blank" rel="noopener" style="font-size:0.8rem;color:var(--gold)">🔗 زيارة الموقع</a>' : '') +
              '</div>';
          }
        }
        container.innerHTML = html;
      }

      renderPartners();

      var pf = document.getElementById('partnerContactForm');
      if (pf) {
        pf.addEventListener('submit', function(e) {
          e.preventDefault();
          var name = document.getElementById('pcName').value.trim();
          var email = document.getElementById('pcEmail').value.trim();
          if (!name || !email) { if (window.showToast) showToast('يرجى ملء الحقول المطلوبة', 'error'); return; }
          pf.style.display = 'none';
          document.getElementById('pcSuccess').style.display = 'block';
        });
      }
    })();
  </script>
<script src="js/navigation.js"></script>
</body>
</html>
