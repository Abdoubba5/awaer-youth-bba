<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://ouyqcyrbppkxvcknxtbn.supabase.co wss://ouyqcyrbppkxvcknxtbn.supabase.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="نشاطات وفعاليات منصة وعي الشباب BBA - حملات توعوية، دورات تدريبية، لقاءات">
  <meta name="theme-color" content="#06090e">
  <title>النشاطات | منصة وعي الشباب BBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/identity.css">
  <link rel="stylesheet" href="css/homepage.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23C9A84C'/%3E%3Ctext y='68' x='50' text-anchor='middle' font-size='50' fill='%2306090e' font-weight='700' font-family='Cairo'%3Eوعي%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="النشاطات BBA">
  <style>
    :root{--bg:#050712;--surface:rgba(12,17,34,0.88);--surface-solid:#0C1122;--surface-card:rgba(16,22,42,0.92);--gold:#C9A84C;--gold-hover:#B8943E;--gold-light:rgba(201,168,76,0.10);--gold-glow:rgba(201,168,76,0.20);--teal:#2DD4BF;--teal-bg:rgba(45,212,191,0.08);--terra:#C2644A;--terra-bg:rgba(194,100,74,0.08);--success:#34D399;--success-bg:rgba(52,211,153,0.10);--danger:#F87171;--danger-bg:rgba(248,113,113,0.10);--text:#F5F0E8;--text-secondary:#D1CEC6;--text-dim:#9E9A94;--text-muted:#7A7670;--border:rgba(201,168,76,0.12);--border-light:rgba(255,255,255,0.04);--border-gold:rgba(201,168,76,0.25);--radius-xs:4px;--radius-sm:6px;--radius-md:12px;--radius-lg:20px;--radius-xl:32px;--shadow-sm:0 2px 8px rgba(0,0,0,0.3);--shadow-md:0 8px 32px rgba(0,0,0,0.4);--shadow-lg:0 16px 48px rgba(0,0,0,0.5);--shadow-gold:0 8px 32px rgba(201,168,76,0.10);--shadow-gold-hover:0 12px 40px rgba(201,168,76,0.20);--font:'Cairo',sans-serif;--transition:all 0.4s cubic-bezier(0.4,0,0.2,1);--bounce:cubic-bezier(0.34,1.56,0.64,1);--nav-height:72px;--nav-height-mobile:64px}
    *,:before,:after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:80px}
    body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.8;direction:rtl;min-height:100vh;-webkit-font-smoothing:antialiased}
    h1{font-size:clamp(1.75rem,4.5vw,3rem)}h2{font-size:clamp(1.5rem,3.5vw,2.25rem)}h3{font-size:clamp(1.25rem,2.5vw,1.5rem)}h1,h2,h3,h4{font-weight:700;line-height:1.4}
    p{color:var(--text-dim);font-size:clamp(0.9rem,1.2vw,1rem)}a{color:var(--gold);text-decoration:none;transition:all 0.3s ease}a:hover{color:var(--gold-hover)}ul{list-style:none}img{max-width:100%;height:auto;display:block}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
    .filter-bar{display:flex;gap:0.75rem;flex-wrap:wrap;margin-bottom:2rem;justify-content:center}
    .filter-bar button{padding:0.5rem 1.25rem;border-radius:100px;font-size:0.82rem;cursor:pointer;transition:var(--transition);font-family:var(--font);border:1px solid var(--border);background:var(--surface);color:var(--text-dim)}
    .filter-bar button.active,.filter-bar button:hover{background:var(--gold-light);color:var(--gold);border-color:var(--border-gold)}
  </style>
</head>
<body>
<div id="navbar"></div>


  <section class="section" style="padding-top:calc(var(--nav-height) + 2rem)">
    <div class="container">
      <div class="section-header">
        <div class="hero-badge" style="margin-bottom:1rem">📋 النشاطات والفعاليات</div>
        <h2>نشاطات منصة وعي الشباب BBA</h2>
        <p>تعرف على أحدث الأنشطة والحملات التوعوية والفعاليات التي تنظمها المنصة</p>
        <span class="gold-accent"></span>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0" id="events">
    <div class="container">
      <h3 style="color:var(--gold);margin-bottom:1rem;text-align:center">📅 الفعاليات القادمة والماضية</h3>
      <div class="filter-bar">
        <button class="active" data-filter="all">الكل</button>
        <button data-filter="open">القادمة</button>
        <button data-filter="completed">المكتملة</button>
        <button data-filter="حملة توعوية">📢 حملات</button>
        <button data-filter="دورة تدريبية">📚 دورات</button>
        <button data-filter="ورشة عمل">🔧 ورش</button>
      </div>
      <div id="eventsGrid" class="events-grid">
        <div style="text-align:center;padding:3rem;color:var(--muted);grid-column:1/-1">
          <div style="font-size:3rem;margin-bottom:1rem">📅</div>
          <p>جاري تحميل الفعاليات...</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section" style="background:var(--bg-warm)" id="activities">
    <div class="container">
      <div class="section-header">
        <h3 style="color:var(--gold)">📋 سجل النشاطات التطوعية</h3>
        <p>أحدث النشاطات التي قام بها متطوعو المنصة</p>
        <span class="gold-accent"></span>
      </div>
      <div id="activityLog" style="max-width:700px;margin:2rem auto">
        <div style="text-align:center;padding:2rem;color:var(--muted)"><p>جاري تحميل النشاطات...</p></div>
      </div>
    </div>
  </section>

<div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/database.js"></script>
  <script src="js/platform-core.js"></script>
  <script src="js/cms.js"></script>
  <script>
    (function() {
      var ts = document.getElementById('activitiesThemeSwitcher');
      if (ts && window.BBA && window.BBA.Theme) window.BBA.Theme.createSwitcher(ts);

      function escapeHtml(t) { if (!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

      /* Load page header from CMS */
      (function loadActivitiesHeader() {
        if (!window.CMS) return;
        var data = window.CMS.getActivitiesCms();
        if (!data) return;
        if (data.title) {
          var h2 = document.querySelector('.section-header h2');
          if (h2) h2.textContent = data.title;
        }
        if (data.subtitle) {
          var p = document.querySelector('.section-header p');
          if (p) p.textContent = data.subtitle;
        }
      })();

      /* Render events */
      function renderEvents(filter) {
        var grid = document.getElementById('eventsGrid');
        if (!grid) return;
        var events = JSON.parse(localStorage.getItem('bba_events') || '[]');
        var filtered = filter && filter !== 'all' ? events.filter(function(e) { return e.status === filter || e.type === filter; }) : events;
        if (filtered.length === 0) {
          grid.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--muted);grid-column:1/-1"><div style="font-size:3rem;margin-bottom:1rem">📅</div><p>لا توجد فعاليات في هذا التصنيف</p></div>';
          return;
        }
        var html = '';
        for (var i = filtered.length - 1; i >= 0; i--) {
          var e = filtered[i];
          var statusColor = e.status === 'open' ? 'var(--success)' : e.status === 'cancelled' ? 'var(--danger)' : 'var(--gold)';
          html += '<div class="event-card">' +
            '<div class="event-card-header"><span class="event-card-icon">' + (e.typeIcon || '📅') + '</span>' +
            '<div><div class="event-card-title">' + escapeHtml(e.title) + '</div>' +
            '<span class="event-card-type">' + escapeHtml(e.type || '') + '</span></div></div>' +
            '<div class="event-card-meta">' +
            (e.date ? '<span>📅 ' + new Date(e.date).toLocaleDateString('ar-DZ',{year:'numeric',month:'long',day:'numeric'}) + '</span>' : '') +
            (e.location ? '<span>📍 ' + escapeHtml(e.location) + '</span>' : '') +
            (e.municipality ? '<span>🏛️ ' + escapeHtml(e.municipality) + '</span>' : '') +
            '</div>' +
            (e.description ? '<p style="font-size:0.82rem;color:var(--text-dim);margin-bottom:0.75rem">' + escapeHtml(e.description).substring(0,120) + (e.description.length > 120 ? '...' : '') + '</p>' : '') +
            '<div style="display:flex;justify-content:space-between;align-items:center">' +
            '<span style="font-size:0.75rem;color:' + statusColor + ';font-weight:600">● ' + (e.status === 'open' ? 'مفتوح' : e.status === 'completed' ? 'مكتمل' : 'ملغى') + '</span>' +
            (e.seats ? '<span style="font-size:0.75rem;color:var(--muted)">👥 ' + (e.seats - (e.registrations || 0)) + ' مقعد متبقي</span>' : '') +
            '</div></div>';
        }
        grid.innerHTML = html;
      }

      /* Filter buttons */
      var filterBtns = document.querySelectorAll('.filter-bar button');
      for (var i = 0; i < filterBtns.length; i++) {
        filterBtns[i].addEventListener('click', function() {
          for (var j = 0; j < filterBtns.length; j++) filterBtns[j].classList.remove('active');
          this.classList.add('active');
          renderEvents(this.getAttribute('data-filter'));
        });
      }

      /* Render activity log */
      function renderActivityLog() {
        var container = document.getElementById('activityLog');
        if (!container) return;
        var acts = JSON.parse(localStorage.getItem('bba_activities') || '[]');
        if (acts.length === 0) {
          container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted)"><p>لا توجد نشاطات مسجلة بعد</p></div>';
          return;
        }
        var html = '<div class="timeline">';
        for (var i = acts.length - 1; i >= 0; i--) {
          var a = acts[i];
          html += '<div class="timeline-item done">' +
            '<div class="timeline-item-text">' + escapeHtml(a.title || '') + '</div>' +
            '<div class="timeline-item-date">' + (a.date ? new Date(a.date).toLocaleDateString('ar-DZ',{year:'numeric',month:'short',day:'numeric'}) : '') +
            (a.points ? ' | ⭐ +' + a.points + ' نقطة' : '') +
            (a.volunteer_name ? ' | 👤 ' + escapeHtml(a.volunteer_name) : '') +
            '</div></div>';
        }
        html += '</div>';
        container.innerHTML = html;
      }

      renderEvents('all');
      renderActivityLog();
    })();
  </script>
<script src="js/navigation.js"></script>
</body>
</html>
