  <style>
    html, body {
      overflow-x: hidden;
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
      direction: rtl;
    }

    /* ============================================================
       ADMIN LOGIN LOCK SCREEN
       Two-column layout: illustration left, form right
       ============================================================ */
    .lock-screen {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      overflow-y: auto;
    }

    .lock-card {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      background: var(--surface-card);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 800px;
      width: 100%;
      margin: 1.5rem;
      box-shadow: var(--shadow-lg), 0 0 60px rgba(201,168,76,0.04);
    }

    .lock-icon {
      flex-shrink: 0;
      width: 280px;
      max-width: 280px;
      max-height: 280px;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lock-icon svg {
      width: 100%;
      height: 100%;
      color: var(--gold);
      opacity: 0.85;
      filter: drop-shadow(0 0 20px rgba(201,168,76,0.12));
    }

    .lock-form {
      flex: 1;
      min-width: 0;
    }

    .lock-form h2 {
      color: var(--gold);
      margin-bottom: 0.4rem;
      font-size: clamp(1.25rem, 2.5vw, 1.5rem);
    }

    .lock-form > p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .lock-error {
      display: none;
      padding: 0.75rem;
      background: var(--danger-bg);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: var(--radius-sm);
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 0.75rem;
      text-align: right;
    }

    .lock-error.visible {
      display: block;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.9rem;
      transition: all 0.3s ease;
      direction: rtl;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08), 0 0 20px rgba(201,168,76,0.04);
      background: rgba(255,255,255,0.06);
    }

    .form-group input:hover {
      background: rgba(255,255,255,0.05);
    }

    .form-group input[dir="ltr"] {
      direction: ltr;
      text-align: left;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: clamp(0.85rem, 1.1vw, 0.95rem);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      outline: none;
      white-space: nowrap;
      position: relative;
      letter-spacing: 0.01em;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%);
      color: var(--bg);
      box-shadow: 0 4px 24px rgba(201,168,76,0.15), 0 1px 4px rgba(201,168,76,0.08);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(201,168,76,0.25), 0 2px 8px rgba(201,168,76,0.12);
      color: var(--bg);
    }

    .btn-primary:active {
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .lock-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      z-index: 9997;
    }

    .lock-footer a {
      color: var(--gold);
      text-decoration: none;
    }

    .lock-footer a:hover {
      text-decoration: underline;
    }

    /* Mobile: stack vertically, form first, illustration second */
    @media (max-width: 768px) {
      .lock-card {
        flex-direction: column;
        padding: 1.5rem;
        gap: 1.25rem;
        margin: 1rem;
      }

      .lock-icon {
        width: 140px;
        max-width: 140px;
        order: 1;
      }

      .lock-form {
        order: 0;
      }

      .lock-footer {
        position: relative;
        margin-top: 1rem;
      }
    }

    @media (max-width: 480px) {
      .lock-card {
        padding: 1.25rem;
        gap: 1rem;
        margin: 0.75rem;
      }

      .lock-icon {
        width: 100px;
        max-width: 100px;
      }
    }
  </style>
</head>
<body>

  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <div id="lockScreen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="lock-form">
        <h2>لوحة الإدارة</h2>
        <p>يرجى تسجيل الدخول للوصول إلى لوحة التحكم</p>
        <form id="loginForm">
          <div class="form-group" style="text-align:right">
            <label for="loginEmail">البريد الإلكتروني</label>
            <input type="email" id="loginEmail" name="email" placeholder="admin@bba.dz" required dir="ltr" autocomplete="email">
          </div>
          <div class="form-group" style="text-align:right">
            <label for="loginPassword">كلمة المرور</label>
            <input type="password" id="loginPassword" name="password" placeholder="••••••••" required dir="ltr" autocomplete="current-password">
          </div>
          <div id="loginError" class="lock-error">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-left:4px">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            البريد الإلكتروني أو كلمة المرور غير صحيحة
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            تسجيل الدخول
          </button>
          <div id="loginRateLimitIndicator"></div>
        </form>
      </div>
    </div>
  </div>

  <div class="lock-footer">
    <span>منصة <a href="index.html">وعي الشباب BBA</a> &mdash; برنامج Dz Young Leaders</span>
  </div>

  <!-- ======== SECURITY HARDENING ======== -->
  <script>
  (function(){
    'use strict';

    /* Block right-click */
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });

    /* Block dev tools shortcuts */
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) { e.preventDefault(); return false; }
      if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) { e.preventDefault(); return false; }
    });

    /* DevTools detection */
    var devtoolsOpen = false;
    var devtoolsCheck = function() {
      var threshold = 160;
      var widthDiff = window.outerWidth - window.innerWidth > threshold;
      var heightDiff = window.outerHeight - window.innerHeight > threshold;
      if ((widthDiff || heightDiff) && !devtoolsOpen) {
        devtoolsOpen = true;
        try {
          var authReady = window.BBA && window.BBA.Auth && typeof window.BBA.Auth.getRole === 'function';
          if (!authReady) {
            setTimeout(function() { devtoolsOpen = false; }, 500);
            return;
          }
          if (window.BBA && window.BBA.Audit) {
            window.BBA.Audit.log('devtools_detected', { page: 'admin.html', severity: 'warning' });
          }
        } catch(e) {}
      } else if (!widthDiff && !heightDiff) {
        devtoolsOpen = false;
      }
    };
    setInterval(devtoolsCheck, 1000);
  })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/database.js"></script>
  <script src="js/audit.js"></script>
  <script src="js/rate-limiter.js"></script>
  <script src="js/rate-limit-indicator.js"></script>
  <script src="js/certificate-security.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/platform-core.js"></script>

  <!-- ======== AUTH LOGIC ======== -->
  <script>
  (function initAdminLogin() {
    var ls = document.getElementById('lockScreen');
    var lf = document.getElementById('loginForm');
    var le = document.getElementById('loginError');

    function byId(id) { return document.getElementById(id); }

    function showToast(msg, type) {
      if (window.BBA && window.BBA.showToast) {
        window.BBA.showToast(msg, type || 'info');
      }
    }

    function redirectToDashboard() {
      window.location.href = 'sidou-da.html';
    }

    /* If already authenticated, redirect immediately */
    function checkExistingSession() {
      return new Promise(function(resolve) {
        var checkDb = setInterval(function() {
          if (window.BBA && window.BBA.Auth) {
            clearInterval(checkDb);
            window.BBA.Auth.initSession().then(function(user) {
              if (user && window.BBA.Auth.isLoggedIn()) {
                var role = window.BBA.Auth.getRole();
                if (role === 'super_admin' || role === 'admin') {
                  redirectToDashboard();
                  resolve(true);
                  return;
                }
              }
              /* Fallback: legacy localStorage auth */
              if (sessionStorage.getItem('bba_admin_auth') === 'true') {
                redirectToDashboard();
                resolve(true);
                return;
              }
              resolve(false);
            });
          }
        }, 200);
        setTimeout(function() {
          clearInterval(checkDb);
          if (sessionStorage.getItem('bba_admin_auth') === 'true') {
            redirectToDashboard();
            resolve(true);
          } else {
            resolve(false);
          }
        }, 8000);
      });
    }

    checkExistingSession().then(function(authed) {
      if (authed) return;

      /* Mount rate limit indicator */
      if (window.BBA && window.BBA.RateLimitIndicator) {
        window.BBA.RateLimitIndicator.mount('loginRateLimitIndicator', 'login');
      }

      /* Wire login form */
      lf.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = byId('loginEmail').value.trim();
        var pass = byId('loginPassword').value;
        var submitBtn = lf.querySelector('button[type="submit"]');

        /* Rate limit check */
        if (window.BBA && window.BBA.RateLimiter) {
          var rl = window.BBA.RateLimiter.check('login');
          if (!rl.allowed) {
            if (le) {
              le.classList.add('visible');
              var et = le.querySelector('.error-text') || le;
              if (et) et.innerHTML = rl.message;
            }
            return;
          }
        }

        /* Try Supabase Auth first */
        if (window.BBA && window.BBA.Auth && window.BBA.Auth.isOnline()) {
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> جاري تسجيل الدخول...';
          }

          window.BBA.Auth.login(email, pass).then(function(result) {
            if (result.success) {
              var role = window.BBA.Auth.getRole();
              if (role === 'super_admin' || role === 'admin') {
                if (window.BBA && window.BBA.RateLimiter) {
                  window.BBA.RateLimiter.reset('login');
                }
                sessionStorage.setItem('bba_admin_auth', 'true');
                if (le) le.classList.remove('visible');
                lf.reset();
                showToast('✅ مرحباً بك في لوحة الإدارة', 'success');
                setTimeout(redirectToDashboard, 800);
              } else {
                if (window.BBA && window.BBA.RateLimiter) {
                  window.BBA.RateLimiter.record('login');
                }
                window.BBA.Auth.logout();
                if (le) le.classList.add('visible');
                var et = le.querySelector('.error-text') || le;
                if (et) et.innerHTML = 'ليس لديك صلاحية الوصول إلى لوحة الإدارة';
              }
            } else {
              if (window.BBA && window.BBA.RateLimiter) {
                window.BBA.RateLimiter.record('login');
              }
              /* Fallback to legacy auth */
              if (email === 'admin@bba.dz' && pass === 'bba2026') {
                if (window.BBA && window.BBA.RateLimiter) {
                  window.BBA.RateLimiter.reset('login');
                }
                sessionStorage.setItem('bba_admin_auth', 'true');
                if (le) le.classList.remove('visible');
                lf.reset();
                showToast('✅ مرحباً بك في لوحة الإدارة', 'success');
                setTimeout(redirectToDashboard, 800);
              } else {
                if (le) le.classList.add('visible');
                byId('loginPassword').value = '';
              }
            }
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> تسجيل الدخول';
            }
          });
        } else {
          /* Supabase offline — use legacy auth only */
          if (email === 'admin@bba.dz' && pass === 'bba2026') {
            if (window.BBA && window.BBA.RateLimiter) {
              window.BBA.RateLimiter.reset('login');
            }
            sessionStorage.setItem('bba_admin_auth', 'true');
            if (le) le.classList.remove('visible');
            lf.reset();
            showToast('✅ مرحباً بك في لوحة الإدارة', 'success');
            setTimeout(redirectToDashboard, 800);
          } else {
            if (window.BBA && window.BBA.RateLimiter) {
              window.BBA.RateLimiter.record('login');
            }
            if (le) le.classList.add('visible');
            byId('loginPassword').value = '';
          }
        }
      });
    });
  })();
  </script>

  <style>
    /* Toast styles matching homepage.css for the login page */
    .toast-container {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1.5rem;
      background: rgba(12, 17, 34, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      font-size: 0.9rem;
      animation: toastSlideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: auto;
      min-width: 280px;
      direction: rtl;
    }

    .toast.toast-exit {
      animation: toastSlideOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .toast-success { border-right: 3px solid var(--success); }
    .toast-error { border-right: 3px solid var(--danger); }
    .toast-info { border-right: 3px solid var(--gold); }

    .toast-icon { flex-shrink: 0; }
    .toast-success .toast-icon { color: var(--success); }
    .toast-error .toast-icon { color: var(--danger); }
    .toast-info .toast-icon { color: var(--gold); }

    @keyframes toastSlideIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes toastSlideOut {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-20px); opacity: 0; }
    }

    @media (max-width: 480px) {
      .toast { min-width: auto; width: calc(100% - 2rem); }
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--bg);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
