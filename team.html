<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://ouyqcyrbppkxvcknxtbn.supabase.co wss://ouyqcyrbppkxvcknxtbn.supabase.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="فريق عمل منصة وعي الشباب BBA - فرق البلديات والمتطوعون">
  <meta name="theme-color" content="#06090e">
  <title>فريق العمل | منصة وعي الشباب BBA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/identity.css">
  <link rel="stylesheet" href="css/homepage.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23C9A84C'/%3E%3Ctext y='68' x='50' text-anchor='middle' font-size='50' fill='%2306090e' font-weight='700' font-family='Cairo'%3Eوعي%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="فريق العمل BBA">
  <style>
    :root{--bg:#050712;--surface:rgba(12,17,34,0.88);--surface-solid:#0C1122;--surface-card:rgba(16,22,42,0.92);--gold:#C9A84C;--gold-hover:#B8943E;--gold-light:rgba(201,168,76,0.10);--gold-glow:rgba(201,168,76,0.20);--teal:#2DD4BF;--teal-bg:rgba(45,212,191,0.08);--terra:#C2644A;--terra-bg:rgba(194,100,74,0.08);--success:#34D399;--success-bg:rgba(52,211,153,0.10);--danger:#F87171;--danger-bg:rgba(248,113,113,0.10);--text:#F5F0E8;--text-secondary:#D1CEC6;--text-dim:#9E9A94;--text-muted:#7A7670;--border:rgba(201,168,76,0.12);--border-light:rgba(255,255,255,0.04);--border-gold:rgba(201,168,76,0.25);--radius-xs:4px;--radius-sm:6px;--radius-md:12px;--radius-lg:20px;--radius-xl:32px;--shadow-sm:0 2px 8px rgba(0,0,0,0.3);--shadow-md:0 8px 32px rgba(0,0,0,0.4);--shadow-lg:0 16px 48px rgba(0,0,0,0.5);--shadow-gold:0 8px 32px rgba(201,168,76,0.10);--shadow-gold-hover:0 12px 40px rgba(201,168,76,0.20);--font:'Cairo',sans-serif;--transition:all 0.4s cubic-bezier(0.4,0,0.2,1);--bounce:cubic-bezier(0.34,1.56,0.64,1);--nav-height:72px;--nav-height-mobile:64px}
    *,:before,:after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:80px}
    body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.8;direction:rtl;min-height:100vh;-webkit-font-smoothing:antialiased}
    h1{font-size:clamp(1.75rem,4.5vw,3rem)}h2{font-size:clamp(1.5rem,3.5vw,2.25rem)}h3{font-size:clamp(1.25rem,2.5vw,1.5rem)}h1,h2,h3,h4{font-weight:700;line-height:1.4}
    p{color:var(--text-dim);font-size:clamp(0.9rem,1.2vw,1rem)}a{color:var(--gold);text-decoration:none;transition:all 0.3s ease}a:hover{color:var(--gold-hover)}ul{list-style:none}img{max-width:100%;height:auto;display:block}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
  </style>
</head>
<body>
<div id="navbar"></div>

  <section class="section" style="padding-top:calc(var(--nav-height) + 2rem)">
    <div class="container">
      <div class="section-header">
        <div class="hero-badge" style="margin-bottom:1rem">👥 فريق العمل</div>
        <h2>فريق منصة وعي الشباب BBA</h2>
        <p>نخبة من الشباب المتطوع والمختصين يعملون معاً لتحقيق رسالة التوعية</p>
        <span class="gold-accent"></span>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <!-- CMS Team Members Grid -->
      <div id="cmsTeamGrid" class="events-grid" style="margin-bottom:2.5rem"></div>

      <h3 style="color:var(--gold);margin-bottom:1.5rem;text-align:center">👥 فرق البلديات</h3>
      <div id="teamsGrid" class="events-grid">
        <div style="text-align:center;padding:3rem;color:var(--muted);grid-column:1/-1">
          <div style="font-size:3rem;margin-bottom:1rem">👥</div>
          <p>جاري تحميل فرق العمل...</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section" style="background:var(--bg-warm)">
    <div class="container">
      <div class="section-header">
        <h3 style="color:var(--gold)">متطوعونا</h3>
        <p>قائمة المتطوعين المسجلين في المنصة</p>
        <span class="gold-accent"></span>
      </div>
      <div id="volunteersGrid" class="impact-grid" style="margin-top:2rem">
        <div style="text-align:center;padding:2rem;color:var(--muted);grid-column:1/-1">
          <p>جاري تحميل بيانات المتطوعين...</p>
        </div>
      </div>
    </div>
  </section>

<div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/database.js"></script>
  <script src="js/platform-core.js"></script>
  <script src="js/cms.js"></script>
  <script>
    (function() {
      var ts = document.getElementById('teamThemeSwitcher');
      if (ts && window.BBA && window.BBA.Theme) window.BBA.Theme.createSwitcher(ts);

      function escapeHtml(t) { if (!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

      function renderTeams() {
        var grid = document.getElementById('teamsGrid');
        if (!grid) return;
        var teams = JSON.parse(localStorage.getItem('bba_teams') || '[]');
        if (teams.length === 0) {
          grid.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--muted);grid-column:1/-1"><div style="font-size:3rem;margin-bottom:1rem">👥</div><p>لا توجد فرق مسجلة بعد</p></div>';
          return;
        }
        var html = '';
        for (var i = 0; i < teams.length; i++) {
          var t = teams[i];
          var members = t.members || [];
          var memberIcons = members.slice(0, 5).map(function(){return '👤';}).join('');
          html += '<div class="scroll-card" style="padding:1.35rem">' +
            '<div class="lantern-ornament" style="margin-bottom:0.75rem"><span class="lantern-ornament-dot"></span></div>' +
            '<h4 style="color:var(--gold);margin-bottom:0.5rem">' + escapeHtml(t.name || '') + '</h4>' +
            '<div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.5rem">📍 ' + escapeHtml(t.municipality || '') + '</div>' +
            '<div style="font-size:0.8rem;color:var(--text-dim)">' + (t.leader ? '👤 القائد: ' + escapeHtml(t.leader) : '') + '</div>' +
            '<div style="font-size:0.8rem;color:var(--text-dim);margin-top:0.3rem">👥 الأعضاء: ' + members.length + ' ' + memberIcons + '</div>' +
            '</div>';
        }
        grid.innerHTML = html;
      }

      function renderVolunteers() {
        var grid = document.getElementById('volunteersGrid');
        if (!grid) return;
        var vols = JSON.parse(localStorage.getItem('bba_volunteers') || '[]');
        if (vols.length === 0) {
          grid.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--muted);grid-column:1/-1"><p>لا يوجد متطوعون مسجلون بعد</p></div>';
          return;
        }
        var html = '';
        for (var i = 0; i < vols.length; i++) {
          var v = vols[i];
          html += '<div class="mosaic-tile" style="padding:1rem">' +
            '<span class="mosaic-corner mosaic-corner-tl"></span><span class="mosaic-corner mosaic-corner-tr"></span>' +
            '<span class="mosaic-corner mosaic-corner-bl"></span><span class="mosaic-corner mosaic-corner-br"></span>' +
            '<div style="font-size:2rem;margin-bottom:0.5rem">' + (v.gender === 'female' ? '👩' : '👤') + '</div>' +
            '<div style="font-weight:600;font-size:0.85rem;color:var(--text)">' + escapeHtml(v.fullName || v.full_name || '') + '</div>' +
            '<div style="font-size:0.75rem;color:var(--muted);margin-top:0.2rem">📍 ' + escapeHtml(v.municipality || '') + '</div>' +
            '</div>';
        }
        grid.innerHTML = html;
      }

      /* Render CMS Team Members */
      function renderTeamMembers() {
        var grid = document.getElementById('cmsTeamGrid');
        if (!grid) return;
        var members = window.CMS ? window.CMS.getTeamMembers() : [];
        members = members.filter(function(m) { return m.published !== false && m.visible !== false; });
        if (members.length === 0) { grid.innerHTML = ''; return; }
        function esc(t) { if (!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        var html = '';
        for (var i = 0; i < members.length; i++) {
          var m = members[i];
          html += '<div class="mosaic-tile" style="padding:1.25rem;text-align:center">' +
            '<span class="mosaic-corner mosaic-corner-tl"></span><span class="mosaic-corner mosaic-corner-tr"></span>' +
            '<span class="mosaic-corner mosaic-corner-bl"></span><span class="mosaic-corner mosaic-corner-br"></span>' +
            (m.image ? '<img src="' + esc(m.image) + '" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 auto 0.75rem;border:2px solid var(--gold)" onerror="this.style.display=\'none\'">' : '<div style="font-size:2.5rem;margin-bottom:0.5rem">👤</div>') +
            '<h4 style="color:var(--gold);font-size:0.9rem;margin-bottom:0.2rem">' + esc(m.name) + '</h4>' +
            '<div style="font-size:0.78rem;color:var(--muted);margin-bottom:0.5rem">' + esc(m.role || '') + '</div>' +
            (m.bio ? '<p style="font-size:0.75rem;color:var(--text-dim);line-height:1.6">' + esc(m.bio).substring(0,100) + '</p>' : '') +
            '</div>';
        }
        grid.innerHTML = html;
      }

      renderTeams();
      renderVolunteers();
      renderTeamMembers();
    })();
  </script>
<script src="js/navigation.js"></script>
</body>
</html>
